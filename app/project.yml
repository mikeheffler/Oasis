# XcodeGen spec. Run `xcodegen` in this folder to make Oasis.xcodeproj.
# The .xcodeproj is not in git. Run xcodegen again after you add or move files.
name: Oasis

options:
  bundleIdPrefix: com.mikeheffler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode (compiler 5.10+)
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  OasisCore:
    path: ../OasisCore

targets:
  Oasis:
    type: application
    platform: iOS
    sources:
      - path: Oasis
    dependencies:
      - package: OasisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OASIS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oasis
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Shows drinking water near you.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}
