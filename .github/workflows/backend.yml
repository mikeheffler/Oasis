name: Backend

on:
  # Apply new migrations when they merge.
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  # Weekly OSM sync: Mondays 09:17 UTC.
  schedule:
    - cron: "17 9 * * 1"
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:
    inputs:
      region:
        description: "Region to sync"
        default: "colorado"
      max_tiles:
        description: "Only the first N tiles (empty = all). Use 2 for a first test."
        default: ""
      migrate_only:
        description: "Only apply migrations, no sync"
        type: boolean
        default: false

concurrency:
  group: backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check the secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret. See docs/phase2-backend.md, section 13."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0  # pinned: "latest" asks the GitHub API and can hit its rate limit
      - name: Apply new migrations
        # `yes` answers the confirmation prompt, if the CLI shows one.
        run: yes | supabase db push --db-url "$SUPABASE_DB_URL"

  sync:
    name: Sync OSM points
    needs: migrate
    if: github.event_name != 'push' && !inputs.migrate_only
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      REGION: ${{ inputs.region }}
      MAX_TILES: ${{ inputs.max_tiles }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SECRET_KEY" ] || missing="$missing SUPABASE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add the secrets:$missing. See docs/phase2-backend.md, section 13."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Build oasis-sync
        working-directory: OasisCore
        run: swift build -c release --product oasis-sync
      - name: Sync
        working-directory: OasisCore
        run: |
          set -- --region "${REGION:-colorado}"
          if [ -n "$MAX_TILES" ]; then set -- "$@" --max-tiles "$MAX_TILES"; fi
          .build/release/oasis-sync "$@"
